name: Auto-tag and publish Docker image

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/price-watcher

jobs:
  tag-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^version' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if git ls-remote --tags origin "$VERSION" | grep -q "$VERSION"; then
            echo "Tag $VERSION already exists, skipping Docker build."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag "$VERSION"
          git push origin "$VERSION"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: steps.tag.outputs.created == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        if: steps.tag.outputs.created == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.value }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.value }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.value }}

      - name: Build and push
        if: steps.tag.outputs.created == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
